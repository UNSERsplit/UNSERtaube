<app-card [width]="buttonWidth" [height]="buttonHeight" [flexdirection]="flexdirection" [variant]="CardVariants.black" >

        <app-status [fontsize]="18" [margin]="0" [padding]="0"></app-status>
    </div>
    <app-button class="disconnect-btn" (click)="handleConnect()" [variant]="ButtonVariant" text="{{buttonContent}}"></app-button>
</app-card>
